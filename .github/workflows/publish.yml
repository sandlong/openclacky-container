name: Publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      openclacky_version:
        description: "Upstream OpenClacky version, without the v prefix"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: openclacky

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.openclacky_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(tr -d '[:space:]' < OPENCLACKY_VERSION)"
          fi

          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"

          {
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:sha-${GITHUB_SHA::12}"
            if [ "${GITHUB_REF}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: local/openclacky:smoke-test
          build-args: |
            OPENCLACKY_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify bundled CLIs
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh local/openclacky:smoke-test -c '
            set -eu
            for command in openclacky node npm npx corepack uv uvx curl git jq rg file patch xz unzip ps pgrep pkill lsof tini; do
              command -v "$command" >/dev/null
            done
            node --version
            npm --version
            npx --version
            uv --version
            uvx --version
            openclacky --version
          '

      - name: Verify server health
        run: |
          set -euo pipefail
          docker run -d --name openclacky-smoke \
            -e CLACKY_ACCESS_KEY= \
            -p 7070:7070 \
            local/openclacky:smoke-test
          trap 'docker logs openclacky-smoke || true; docker rm -f openclacky-smoke || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7070/health | grep -q '"status"'; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            OPENCLACKY_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=openclacky-standard
            org.opencontainers.image.description=OpenClacky with common agent CLIs and amd64/arm64 support
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
