name: Publish container

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Check the official image daily; scheduled runs publish only after it changes.
    - cron: "30 18 * * *"

permissions:
  contents: read
  packages: write

env:
  OFFICIAL_IMAGE: ghcr.io/clacky-ai/openclacky:latest
  IMAGE_NAME: openclacky

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve upstream image
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'

          manifest_metadata() {
            local repository="$1"
            local reference="$2"
            local token headers body status digest

            token="$(curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" \
              | jq -er '.token // .access_token')"
            headers="$(mktemp)"
            body="$(mktemp)"

            if ! status="$(curl -sS --retry 4 --retry-all-errors --retry-delay 2 \
              -D "$headers" -o "$body" -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: ${ACCEPT}" \
              "https://ghcr.io/v2/${repository}/manifests/${reference}")"; then
              echo "Failed to query ghcr.io/${repository}:${reference}." >&2
              cat "$body" >&2
              rm -f "$headers" "$body"
              return 1
            fi

            case "$status" in
              200)
                digest="$(awk 'tolower($1) == "docker-content-digest:" { gsub("\r", "", $2); print $2 }' "$headers")"
                if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  echo "GHCR returned no valid digest for ${repository}:${reference}." >&2
                  rm -f "$headers" "$body"
                  return 1
                fi
                printf '200 %s\n' "$digest"
                ;;
              404)
                printf '404\n'
                ;;
              *)
                echo "GHCR returned HTTP ${status} for ${repository}:${reference}:" >&2
                cat "$body" >&2
                rm -f "$headers" "$body"
                return 1
                ;;
            esac

            rm -f "$headers" "$body"
          }

          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"
          IMAGE_REPOSITORY="${IMAGE#ghcr.io/}"
          UPSTREAM="${OFFICIAL_IMAGE#ghcr.io/}"
          UPSTREAM_REFERENCE="${UPSTREAM##*:}"
          UPSTREAM_REPOSITORY="${UPSTREAM%:*}"

          read -r UPSTREAM_STATUS UPSTREAM_DIGEST <<< \
            "$(manifest_metadata "$UPSTREAM_REPOSITORY" "$UPSTREAM_REFERENCE")"
          if [ "$UPSTREAM_STATUS" != 200 ]; then
            echo "Official image ${OFFICIAL_IMAGE} was not found." >&2
            exit 1
          fi

          UPSTREAM_SHORT="${UPSTREAM_DIGEST#sha256:}"
          UPSTREAM_SHORT="${UPSTREAM_SHORT:0:12}"
          PUBLISHED_TAG="upstream-${UPSTREAM_SHORT}"
          PUBLISHED_REF="${IMAGE}:${PUBLISHED_TAG}"
          SHOULD_PUBLISH=true

          if [ "${{ github.event_name }}" = "schedule" ]; then
            read -r PUBLISHED_STATUS _ <<< \
              "$(manifest_metadata "$IMAGE_REPOSITORY" "$PUBLISHED_TAG")"
            if [ "$PUBLISHED_STATUS" = 200 ]; then
              SHOULD_PUBLISH=false
            fi
          fi

          {
            echo "image=${IMAGE}"
            echo "upstream_digest=${UPSTREAM_DIGEST}"
            echo "upstream_short=${UPSTREAM_SHORT}"
            echo "should_publish=${SHOULD_PUBLISH}"
          } >> "$GITHUB_OUTPUT"

          echo "Official OpenClacky digest: ${UPSTREAM_DIGEST}"
          echo "Previously published tag: ${PUBLISHED_REF}"
          echo "Publish: ${SHOULD_PUBLISH}"

      - name: No upstream change
        if: steps.source.outputs.should_publish != 'true'
        run: echo "The official OpenClacky image digest has not changed; nothing to publish."

      - name: Checkout
        if: steps.source.outputs.should_publish == 'true'
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: steps.source.outputs.should_publish == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.source.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Resolve and validate upstream payload
        if: steps.source.outputs.should_publish == 'true'
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempt status

            for attempt in 1 2 3 4; do
              if "$@"; then
                return 0
              else
                status=$?
              fi

              if [ "$attempt" -eq 4 ]; then
                echo "Command failed after ${attempt} attempts (exit ${status}): $*" >&2
                return "$status"
              fi

              echo "Command failed (attempt ${attempt}/4, exit ${status}); retrying: $*" >&2
              sleep $((attempt * 3))
            done
          }

          IMAGE="${{ steps.source.outputs.image }}"
          UPSTREAM_DIGEST="${{ steps.source.outputs.upstream_digest }}"
          UPSTREAM_SHORT="${{ steps.source.outputs.upstream_short }}"
          UPSTREAM_REF="${OFFICIAL_IMAGE}@${UPSTREAM_DIGEST}"

          retry docker pull --platform linux/amd64 "$UPSTREAM_REF" >/dev/null
          UPSTREAM_VERSION="$(docker run --rm --platform linux/amd64 --entrypoint ruby "$UPSTREAM_REF" \
            -e 'require "clacky"; print Clacky::VERSION')"
          RUBY_VERSION="$(docker run --rm --platform linux/amd64 --entrypoint ruby "$UPSTREAM_REF" \
            -e 'print RUBY_VERSION')"

          NATIVE_FILES="$(docker run --rm --platform linux/amd64 --entrypoint sh "$UPSTREAM_REF" -c \
            'find /usr/local/bundle -type f \( -name "*.so" -o -name "*.bundle" \) -print')"
          if [ -n "$NATIVE_FILES" ]; then
            echo "The official OpenClacky bundle now contains architecture-specific files:" >&2
            echo "$NATIVE_FILES" >&2
            echo "Refusing to copy an amd64 bundle into the arm64 runtime." >&2
            exit 1
          fi

          {
            echo "image=${IMAGE}"
            echo "upstream_digest=${UPSTREAM_DIGEST}"
            echo "upstream_version=${UPSTREAM_VERSION}"
            echo "ruby_version=${RUBY_VERSION}"
            echo "should_publish=true"
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:upstream-${UPSTREAM_VERSION}"
            echo "${IMAGE}:upstream-${UPSTREAM_SHORT}"
            echo "${IMAGE}:sha-${GITHUB_SHA::12}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Official OpenClacky: ${UPSTREAM_VERSION} (${UPSTREAM_DIGEST})"
          echo "Required native Ruby runtime: ${RUBY_VERSION}"
          echo "Publish: true"

      - name: Build amd64 smoke-test image
        if: steps.meta.outputs.should_publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: local/openclacky:amd64-smoke
          build-args: |
            OPENCLACKY_IMAGE=${{ env.OFFICIAL_IMAGE }}@${{ steps.meta.outputs.upstream_digest }}
            RUBY_IMAGE=ruby:${{ steps.meta.outputs.ruby_version }}-slim
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
            UPSTREAM_IMAGE_NAME=${{ env.OFFICIAL_IMAGE }}
            UPSTREAM_DIGEST=${{ steps.meta.outputs.upstream_digest }}
            UPSTREAM_VERSION=${{ steps.meta.outputs.upstream_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build arm64 smoke-test image
        if: steps.meta.outputs.should_publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: local/openclacky:arm64-smoke
          build-args: |
            OPENCLACKY_IMAGE=${{ env.OFFICIAL_IMAGE }}@${{ steps.meta.outputs.upstream_digest }}
            RUBY_IMAGE=ruby:${{ steps.meta.outputs.ruby_version }}-slim
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
            UPSTREAM_IMAGE_NAME=${{ env.OFFICIAL_IMAGE }}
            UPSTREAM_DIGEST=${{ steps.meta.outputs.upstream_digest }}
            UPSTREAM_VERSION=${{ steps.meta.outputs.upstream_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify both architecture-native runtimes
        if: steps.meta.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          verify_image() {
            local image="$1"
            local platform="$2"
            local expected_arch="$3"

            docker run --rm --platform "$platform" --entrypoint sh "$image" -c '
              set -eu
              for command in openclacky node npm npx corepack uv uvx curl git jq rg file patch xz unzip ps pgrep pkill lsof tini mise; do
                command -v "$command" >/dev/null
              done
              ruby -e "require %q[clacky]; print Clacky::VERSION"
              printf "\n"
              ruby -e "print RUBY_VERSION"
              printf "\n"
              uname -m
              node --version
              uv --version
            ' > "/tmp/${expected_arch}.txt"

            sed -n '1p' "/tmp/${expected_arch}.txt" | grep -Fx '${{ steps.meta.outputs.upstream_version }}'
            sed -n '2p' "/tmp/${expected_arch}.txt" | grep -Fx '${{ steps.meta.outputs.ruby_version }}'
            sed -n '3p' "/tmp/${expected_arch}.txt" | grep -Fx "$expected_arch"
            cat "/tmp/${expected_arch}.txt"
          }

          verify_image local/openclacky:amd64-smoke linux/amd64 x86_64
          verify_image local/openclacky:arm64-smoke linux/arm64 aarch64

      - name: Verify server health on both architectures
        if: steps.meta.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          verify_health() {
            local image="$1"
            local platform="$2"
            local name="$3"

            docker run -d --platform "$platform" --name "$name" \
              "$image"

            for _ in $(seq 1 45); do
              if docker exec "$name" curl -fsS http://127.0.0.1:7070/health | grep -q '"status"'; then
                docker rm -f "$name" >/dev/null
                return 0
              fi
              sleep 2
            done

            docker logs "$name" || true
            docker rm -f "$name" >/dev/null || true
            return 1
          }

          verify_health local/openclacky:amd64-smoke linux/amd64 openclacky-amd64
          verify_health local/openclacky:arm64-smoke linux/arm64 openclacky-arm64

      - name: Log in to GHCR
        if: steps.meta.outputs.should_publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture image
        if: steps.meta.outputs.should_publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            OPENCLACKY_IMAGE=${{ env.OFFICIAL_IMAGE }}@${{ steps.meta.outputs.upstream_digest }}
            RUBY_IMAGE=ruby:${{ steps.meta.outputs.ruby_version }}-slim
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
            UPSTREAM_IMAGE_NAME=${{ env.OFFICIAL_IMAGE }}
            UPSTREAM_DIGEST=${{ steps.meta.outputs.upstream_digest }}
            UPSTREAM_VERSION=${{ steps.meta.outputs.upstream_version }}
          labels: |
            org.opencontainers.image.title=openclacky-standard
            org.opencontainers.image.description=Multi-architecture OpenClacky runtime with common agent CLIs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.upstream_version }}
            io.github.sandlong.openclacky.source.image=${{ env.OFFICIAL_IMAGE }}
            io.github.sandlong.openclacky.source.digest=${{ steps.meta.outputs.upstream_digest }}
            io.github.sandlong.openclacky.runtime.image=ruby:${{ steps.meta.outputs.ruby_version }}-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max
